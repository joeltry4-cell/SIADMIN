<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Isi Absensi')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Isi Absensi</h1>
                <p class="subtitle">Catat kehadiran Anda untuk hari ini</p>
            </div>
        </div>

        <div class="card">
            <form th:action="@{/absensi/simpan}" th:object="${absensi}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="tanggal">Tanggal</label>
                        <input type="date" id="tanggal" th:field="*{tanggal}">
                        <span class="error-text" th:if="${#fields.hasErrors('tanggal')}" th:errors="*{tanggal}"></span>
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" th:field="*{status}">
                            <option value="">-- Pilih --</option>
                            <option th:each="s : ${statusList}" th:value="${s}" th:text="${s}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                    </div>

                    <div class="form-group">
                        <label for="jamMasuk">Jam Masuk</label>
                        <input type="time" id="jamMasuk" th:field="*{jamMasuk}">
                    </div>

                    <div class="form-group">
                        <label for="jamKeluar">Jam Keluar</label>
                        <input type="time" id="jamKeluar" th:field="*{jamKeluar}">
                    </div>

                    <div class="form-group full">
                        <label for="keterangan">Keterangan</label>
                        <textarea id="keterangan" rows="2" th:field="*{keterangan}"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <a th:href="@{/absensi}" class="btn btn-outline">Batal</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
