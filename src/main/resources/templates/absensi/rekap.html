<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Rekap Absensi')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Rekap Absensi</h1>
                <p class="subtitle">Pantau kehadiran seluruh karyawan per tanggal</p>
            </div>
        </div>

        <div class="flash-success" th:if="${pesan}" th:text="${pesan}"></div>

        <div class="card">
            <form class="search-bar" method="get" th:action="@{/absensi/rekap}">
                <input type="date" name="tanggal" th:value="${tanggal}">
                <button type="submit" class="btn btn-outline">Tampilkan</button>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>NIP</th>
                        <th>Nama</th>
                        <th>Departemen</th>
                        <th>Jam Masuk</th>
                        <th>Jam Keluar</th>
                        <th>Status</th>
                        <th>Keterangan</th>
                        <th>Aksi</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${daftarAbsensi}">
                        <td th:text="${a.karyawan.nip}"></td>
                        <td th:text="${a.karyawan.namaLengkap}"></td>
                        <td th:text="${a.karyawan.departemen}"></td>
                        <td th:text="${a.jamMasuk} ?: '-'"></td>
                        <td th:text="${a.jamKeluar} ?: '-'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${a.status.name() == 'HADIR'} ? 'badge-green' : (${a.status.name() == 'ALPA'} ? 'badge-red' : 'badge-amber')"
                                  th:text="${a.status}"></span>
                        </td>
                        <td th:text="${a.keterangan}"></td>
                        <td>
                            <form th:action="@{/absensi/hapus/{id}(id=${a.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Hapus data absensi ini?');">
                                <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="empty-state" th:if="${#lists.isEmpty(daftarAbsensi)}">
                    Tidak ada data absensi pada tanggal ini.
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
