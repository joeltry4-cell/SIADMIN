<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Cuti Saya')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Cuti Saya</h1>
                <p class="subtitle" th:if="${karyawan != null}" th:text="${karyawan.namaLengkap} + ' &middot; ' + ${karyawan.jabatan}"></p>
            </div>
            <a th:if="${karyawan != null}" th:href="@{/cuti/tambah}" class="btn btn-primary">+ Ajukan Cuti</a>
        </div>

        <div class="flash-success" th:if="${pesan}" th:text="${pesan}"></div>

        <div class="card" th:if="${karyawan == null}">
            <p class="text-muted">Akun Anda belum terhubung dengan data karyawan, sehingga tidak dapat mengajukan cuti. Hubungi admin untuk menautkan akun.</p>
        </div>

        <div class="card" th:if="${karyawan != null}">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Tanggal Mulai</th>
                        <th>Tanggal Selesai</th>
                        <th>Jenis</th>
                        <th>Alasan</th>
                        <th>Status</th>
                        <th>Catatan Admin</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${daftarCuti}">
                        <td th:text="${c.tanggalMulai}"></td>
                        <td th:text="${c.tanggalSelesai}"></td>
                        <td th:text="${c.jenis}"></td>
                        <td th:text="${c.alasan}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${c.status.name() == 'DISETUJUI'} ? 'badge-green' : (${c.status.name() == 'DITOLAK'} ? 'badge-red' : 'badge-amber')"
                                  th:text="${c.status}"></span>
                        </td>
                        <td th:text="${c.catatanAdmin} ?: '-'"></td>
                    </tr>
                    </tbody>
                </table>

                <div class="empty-state" th:if="${#lists.isEmpty(daftarCuti)}">
                    Belum ada pengajuan cuti.
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
