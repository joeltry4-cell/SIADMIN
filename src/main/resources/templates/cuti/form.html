<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Ajukan Cuti')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Ajukan Cuti</h1>
                <p class="subtitle">Isi pengajuan cuti/izin/sakit untuk disetujui admin</p>
            </div>
        </div>

        <div class="card">
            <form th:action="@{/cuti/simpan}" th:object="${cuti}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="tanggalMulai">Tanggal Mulai</label>
                        <input type="date" id="tanggalMulai" th:field="*{tanggalMulai}">
                        <span class="error-text" th:if="${#fields.hasErrors('tanggalMulai')}" th:errors="*{tanggalMulai}"></span>
                    </div>

                    <div class="form-group">
                        <label for="tanggalSelesai">Tanggal Selesai</label>
                        <input type="date" id="tanggalSelesai" th:field="*{tanggalSelesai}">
                        <span class="error-text" th:if="${#fields.hasErrors('tanggalSelesai')}" th:errors="*{tanggalSelesai}"></span>
                    </div>

                    <div class="form-group">
                        <label for="jenis">Jenis</label>
                        <select id="jenis" th:field="*{jenis}">
                            <option value="">-- Pilih --</option>
                            <option th:each="j : ${jenisList}" th:value="${j}" th:text="${j}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('jenis')}" th:errors="*{jenis}"></span>
                    </div>

                    <div class="form-group full">
                        <label for="alasan">Alasan</label>
                        <textarea id="alasan" rows="3" th:field="*{alasan}"></textarea>
                        <span class="error-text" th:if="${#fields.hasErrors('alasan')}" th:errors="*{alasan}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Ajukan</button>
                    <a th:href="@{/cuti}" class="btn btn-outline">Batal</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
