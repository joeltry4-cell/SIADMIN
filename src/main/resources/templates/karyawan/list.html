<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Data Karyawan')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Data Karyawan</h1>
                <p class="subtitle">Kelola data pribadi, jabatan, dan status kepegawaian</p>
            </div>
            <a th:href="@{/karyawan/tambah}" class="btn btn-primary">+ Tambah Karyawan</a>
        </div>

        <div class="flash-success" th:if="${pesan}" th:text="${pesan}"></div>

        <div class="card">
            <form class="search-bar" method="get" th:action="@{/karyawan}">
                <input type="text" name="q" placeholder="Cari nama atau NIP..." th:value="${keyword}">
                <button type="submit" class="btn btn-outline">Cari</button>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>NIP</th>
                        <th>Nama Lengkap</th>
                        <th>Departemen</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Aktif</th>
                        <th>Aksi</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="k : ${daftarKaryawan}">
                        <td th:text="${k.nip}"></td>
                        <td th:text="${k.namaLengkap}"></td>
                        <td th:text="${k.departemen}"></td>
                        <td th:text="${k.jabatan}"></td>
                        <td th:text="${k.statusKepegawaian}"></td>
                        <td>
                            <span th:if="${k.aktif}" class="badge badge-green">Aktif</span>
                            <span th:unless="${k.aktif}" class="badge badge-gray">Nonaktif</span>
                        </td>
                        <td>
                            <a th:href="@{/karyawan/detail/{id}(id=${k.id})}" class="btn btn-outline btn-sm">Detail</a>
                            <a th:href="@{/karyawan/edit/{id}(id=${k.id})}" class="btn btn-outline btn-sm">Edit</a>
                            <form th:action="@{/karyawan/hapus/{id}(id=${k.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Hapus data karyawan ini?');">
                                <button type="submit" class="btn btn-danger btn-sm">Hapus</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div class="empty-state" th:if="${#lists.isEmpty(daftarKaryawan)}">
                    Belum ada data karyawan.
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
