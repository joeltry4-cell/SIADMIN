<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Ganti Password')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Ganti Password</h1>
                <p class="subtitle">Perbarui password akun Anda secara berkala</p>
            </div>
        </div>

        <div class="card" style="max-width: 420px;">
            <div class="flash-success" th:if="${sukses}" th:text="${sukses}"></div>
            <div class="flash-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/profil/ganti-password}" method="post">
                <div class="form-group" style="margin-bottom:16px;">
                    <label for="passwordLama">Password Lama</label>
                    <input type="password" id="passwordLama" name="passwordLama" required>
                </div>
                <div class="form-group" style="margin-bottom:16px;">
                    <label for="passwordBaru">Password Baru</label>
                    <input type="password" id="passwordBaru" name="passwordBaru" minlength="8" required>
                </div>
                <div class="form-group" style="margin-bottom:16px;">
                    <label for="konfirmasiPassword">Konfirmasi Password Baru</label>
                    <input type="password" id="konfirmasiPassword" name="konfirmasiPassword" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary">Simpan Password</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
