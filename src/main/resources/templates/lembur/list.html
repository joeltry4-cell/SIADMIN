<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Lembur Saya')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Lembur Saya</h1>
                <p class="subtitle" th:if="${karyawan != null}" th:text="${karyawan.namaLengkap} + ' &middot; ' + ${karyawan.jabatan}"></p>
            </div>
            <a th:if="${karyawan != null}" th:href="@{/lembur/tambah}" class="btn btn-primary">+ Ajukan Lembur</a>
        </div>

        <div class="flash-success" th:if="${pesan}" th:text="${pesan}"></div>

        <div class="card" th:if="${karyawan == null}">
            <p class="text-muted">Akun Anda belum terhubung dengan data karyawan, sehingga tidak dapat mengajukan lembur. Hubungi admin untuk menautkan akun.</p>
        </div>

        <div class="card" th:if="${karyawan != null}">
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Jam Mulai</th>
                        <th>Jam Selesai</th>
                        <th>Jumlah Jam</th>
                        <th>Alasan</th>
                        <th>Status</th>
                        <th>Catatan Admin</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${daftarLembur}">
                        <td th:text="${l.tanggal}"></td>
                        <td th:text="${l.jamMulai}"></td>
                        <td th:text="${l.jamSelesai}"></td>
                        <td th:text="${#numbers.formatDecimal(l.jumlahJam, 1, 1)}"></td>
                        <td th:text="${l.alasan}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${l.status.name() == 'DISETUJUI'} ? 'badge-green' : (${l.status.name() == 'DITOLAK'} ? 'badge-red' : 'badge-amber')"
                                  th:text="${l.status}"></span>
                        </td>
                        <td th:text="${l.catatanAdmin} ?: '-'"></td>
                    </tr>
                    </tbody>
                </table>

                <div class="empty-state" th:if="${#lists.isEmpty(daftarLembur)}">
                    Belum ada pengajuan lembur.
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
