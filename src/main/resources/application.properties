spring.application.name=siadmin

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/siadmin_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Only used the very first time the app starts (when no admin user exists yet).
# Actual values come from the SIADMIN_ADMIN_USERNAME / SIADMIN_ADMIN_PASSWORD environment variables (set as
# Windows user env vars on this machine) so no real credentials are committed to source control.
siadmin.admin.username=${SIADMIN_ADMIN_USERNAME:admin}
siadmin.admin.password=${SIADMIN_ADMIN_PASSWORD:}
